# OpenAPI Overlay (https://spec.openapis.org/overlay/v1.0.0.html) for ANVISA's
# "Consultas Externas" API. Every action encodes behavior we observed against the
# live API on 2026-09-06 (JSON endpoints) and 2026-09-08 (the downloads) that the
# published spec gets wrong or leaves out.
# Evidence for each action: the recorded responses in fixtures/consultas-externas/.
overlay: 1.0.0
info:
  title: ANVISA Consultas Externas — observed-behavior corrections
  version: "2026-09-08"
extends: ./consultas-externas.openapi.json

actions:
  # 1. The published info block has unresolved Maven placeholders.
  - target: $.info
    update:
      title: ANVISA Consultas Externas API
      version: "2026-09-06"
      description: >-
        Consultas públicas da ANVISA (UDI de dispositivos médicos, nomes técnicos, fila de
        análise, listas e assuntos de peticionamento). Esta descrição foi corrigida por overlay
        a partir do comportamento observado: veja `x-anvisa-client-requirements`.

  # 2. Token lifetime and the absence of a refresh token are not documented.
  - target: $.components.securitySchemes.Keycloak
    update:
      description: >-
        Keycloak OAuth2 client credentials (realm `externo`). The access token expires in
        1740 s (the portal's token tutorial says 300; the live value is 1740) and no refresh
        token is issued; request a new token with the same credentials. The JWT carries
        `aud: [consultas-externas-service, account]` and the single role
        `CONSULTASEXTERNAS_LEITURA`; there are no per-endpoint scopes.
      x-token-lifetime-seconds: 1740
      x-jwt-role: CONSULTASEXTERNAS_LEITURA

  # 3. Client requirements the spec does not mention.
  - target: $
    update:
      x-anvisa-client-requirements:
        userAgent: >-
          Required. Cloudflare answers HTTP 403 (HTML "Attention Required") to curl's default
          User-Agent, even for this spec document. Send a descriptive User-Agent.
        rateLimit:
          type: >-
            token bucket (Spring Cloud Gateway). Observed 2026-09-06 to be shared between the
            authenticated API and the unauthenticated portal backend on the same gateway, i.e.
            keyed by source address rather than by client_id.
          burstCapacity: 25
          replenishRate: 1
          headers:
            - X-RateLimit-Remaining
            - X-RateLimit-Burst-Capacity
            - X-RateLimit-Replenish-Rate
            - X-RateLimit-Requested-Tokens
        dates: All date-time fields are sent as integer epoch milliseconds.
        errors: >-
          Request validation failures are returned as HTTP 500 with the `ErroApi` envelope,
          not as 400.

  # 4. Rate-limit response headers, reusable.
  - target: $.components
    update:
      headers:
        X-RateLimit-Remaining:
          description: Tokens left in the bucket after this request (shared per source address).
          schema: {type: integer}
        X-RateLimit-Burst-Capacity:
          description: Bucket size (observed 25).
          schema: {type: integer}
        X-RateLimit-Replenish-Rate:
          description: Tokens added per second (observed 1).
          schema: {type: integer}

  # 5. Every response carries them.
  - target: $.paths.*.*.responses.*
    update:
      headers:
        X-RateLimit-Remaining: {$ref: "#/components/headers/X-RateLimit-Remaining"}
        X-RateLimit-Burst-Capacity: {$ref: "#/components/headers/X-RateLimit-Burst-Capacity"}
        X-RateLimit-Replenish-Rate: {$ref: "#/components/headers/X-RateLimit-Replenish-Rate"}

  # 6. The error envelope, absent from the spec.
  - target: $.components.schemas
    update:
      ErroApi:
        type: object
        description: >-
          Envelope returned with HTTP 500 for both internal errors and request validation
          failures (missing required filter, page < 1, malformed body).
        properties:
          status: {type: string, example: INTERNAL_SERVER_ERROR}
          mensagem:
            type: string
            description: >-
              Human message, or an unresolved i18n key such as `mensagens.MSG-062`
              (= at least one filter is required).
          data_hora:
            type: array
            description: Server-local timestamp as [year, month, day, hour, minute, second, nanosecond].
            items: {type: integer}
            minItems: 7
            maxItems: 7
          mensagem_detalhada:
            type: string
            description: Detail text, e.g. "Filtro 'subfila' não informado." or a Java stack message.

  # 7./8. Point every 500 response at it (drop the placeholder `type: object` first).
  - target: $.paths.*.*.responses['500'].content['*/*'].schema.type
    remove: true
  - target: $.paths.*.*.responses['500'].content['*/*'].schema
    update: {$ref: "#/components/schemas/ErroApi"}
  - target: $.paths.*.*.responses['500']
    update:
      description: Internal error OR request validation failure (see ErroApi.mensagem / mensagem_detalhada).

  # 9./10./11. Pagination: request is 1-based, response is a 0-based Spring Page.
  - target: $.components.schemas.PaginationBuilder.properties.page
    update:
      minimum: 1
      description: >-
        1-based page number. page=0 fails with "Page index must not be less than zero!".
        Responses are Spring Page objects and report the page 0-based in `number` /
        `pageable.pageNumber`.
  - target: $.components.schemas.PaginationBuilder.properties.size
    update: {minimum: 1}
  - target: $.components.schemas.PaginationBuilder.properties.sorting
    update:
      description: Map of column name to ASC/DESC. Sending an array is rejected with a Jackson deserialization error.
  - target: $.components.schemas.PaginationBuilder.properties.filter
    update:
      description: >-
        Map of filter key to value. Required keys depend on the endpoint; see each
        operation's `x-required-filters`.

  # 12./13. FilaCalculadaDTO fields typed `object` are an integer and two epoch-ms dates.
  - target: $.components.schemas.FilaCalculadaDTO.properties.nuOrdem
    update: {type: integer, format: int32, description: Position in the queue (1 = next).}
  - target: $.components.schemas.FilaCalculadaDTO.properties.dtEntrada
    update: {type: string, format: date-time}
  - target: $.components.schemas.FilaCalculadaDTO.properties.dtGeracaoFila
    update: {type: string, format: date-time, description: When this queue snapshot was generated (daily).}

  # 14. Wire format of every date-time field (listed explicitly: a JSONPath filter on
  #     `properties` corrupts the dict in jsonpath-ng, and explicit targets are clearer anyway).
  - &epoch_millis
    target: $.components.schemas.UdiDTO.properties['dtPublicacao']
    update:
      x-wire-format: epoch-millis
      description: Sent as integer epoch milliseconds (midnight America/Sao_Paulo for date-only values).
  - {<<: *epoch_millis, target: "$.components.schemas.NomeTecnicoDTO.properties['dataAtualizacao']"}
  - {<<: *epoch_millis, target: "$.components.schemas.ConsultaFuncionamento.properties['dataAutorizacao','dataAtualizacao']"}
  - {<<: *epoch_millis, target: "$.components.schemas.DispositivoDTO.properties['dtDescontinuacao','dtPublicacao']"}
  - {<<: *epoch_millis, target: "$.components.schemas.RegistroProdutoDTO.properties['dtVencimento','dtCancelamento']"}
  - {<<: *epoch_millis, target: "$.components.schemas.RegistroProdutoView.properties['dtVencimento','dtCancelamento']"}
  - {<<: *epoch_millis, target: "$.components.schemas.VersaoDispositivoDTO.properties['dtVersao']"}
  - {<<: *epoch_millis, target: "$.components.schemas.HistoricoUdiDTO.properties['dtInicio','dtFim','dtGeracao']"}
  - {<<: *epoch_millis, target: "$.components.schemas.FilaCalculadaDTO.properties['dtEntrada','dtGeracaoFila']"}

  # 15./16. POST /udi needs at least one filter; fix the example (string page, bogus `count`).
  - target: $.paths['/api/v1/udi'].post
    update:
      description: >-
        Paginated UDI search. At least one `filter` key is required; an empty filter fails
        with HTTP 500 and `mensagem: mensagens.MSG-062`. Verified live: `nomeComercial`
        (substring), `udiDi` (exact), `cnpjDetentora`, `codigoGmdn`, `nuRegistro`; the other
        keys come from the published example and are untested. The
        filter check runs before the page check: `page: 0` with an empty filter still yields
        MSG-062, not the page-index error.
      x-required-filters:
        anyOf: [nomeComercial, udiDi, cnpjDetentora, codigoGmdn, nuRegistro, razaoSocialFabLegal,
                categoriaDispositivo, tipoCadastro, versaoModelo, usoLeigo, incorpora]
        verified: [nomeComercial, udiDi, cnpjDetentora, codigoGmdn, nuRegistro]
  - target: $.paths['/api/v1/udi'].post.requestBody.content['application/json'].examples['Filtro completo de UDI'].value.count
    remove: true
  - target: $.paths['/api/v1/udi'].post.requestBody.content['application/json'].examples['Filtro completo de UDI'].value
    update: {page: 1, size: 10, filter: {nomeComercial: cateter}}

  # 19. The list view returns "N" for UdiDTO.desbloqueado while the detail view
  #     (DispositivoDTO.desbloqueado, enumerated SIM/NAO) returns "NAO" for the same device.
  #     The enums on DispositivoDTO were verified live (fixtures/udi_detail_377.json) and are kept.
  - target: $.components.schemas.UdiDTO.properties.desbloqueado
    update:
      description: 'Observed value: "N" (the detail endpoint uses SIM/NAO for the same flag).'

  # 17./18. POST /fila/consulta needs filter.subfila and is not paginated.
  - target: $.paths['/api/v1/fila/consulta'].post
    update:
      description: >-
        Returns the whole calculated queue for one subqueue. `filter.subfila` (integer id
        from GET /api/v1/fila/{codigoGrupo}/subfila) is required, otherwise HTTP 500
        "Filtro 'subfila' não informado.". `page` and `size` are ignored.
      x-required-filters: {allOf: [subfila]}
      x-paginated: false
      x-observed-sizes: >-
        Whole queues observed on 2026-09-06: subfila 167 → 40 rows, subfila 161 → 35 rows,
        subfila 1742 → 71 rows; the sibling /lista/consulta returned 555 rows through the same
        DTO. No size cap. A full crawl of all 314 subfilas listed by the catalogs held 10,390
        rows.
      x-empty-queue: >-
        A subfila with nothing queued answers HTTP 404 with an empty body, not an empty array
        (88 of 314 subfilas on 2026-09-06, e.g. 1721 and 2609). An unknown id gets the same.
  - target: $.paths['/api/v1/fila/consulta'].post.requestBody.content['application/json'].examples['Consulta de fila calculada'].value
    update: {page: 1, filter: {subfila: 167}}

  # POST /lista/consulta behaves like /fila/consulta, including the filter key name.
  - target: $.paths['/api/v1/lista/consulta'].post
    update:
      description: >-
        Returns the whole calculated list for one sublista (555 rows for sublista 2141 on
        2026-09-06). The required filter key is `subfila`, not `sublista`: an integer id from
        GET /api/v1/lista/{codigoGrupo}/sublista, otherwise HTTP 500 "Filtro 'subfila' não
        informado.". `page` and `size` are ignored.
      x-required-filters: {allOf: [subfila]}
      x-paginated: false
  - target: $.paths['/api/v1/lista/consulta'].post.requestBody.content['application/json'].examples['Consulta de fila calculada'].value
    update: {page: 1, filter: {subfila: 2141}}
  - target: $.paths['/api/v1/nomeTecnico'].post
    update:
      description: >-
        Paginated technical names of health products (2,678 rows on 2026-09-06). Works with
        an empty `filter`. Verified live: `nomeTecnico` (substring) and `categoriaProduto`
        (id from GET /nomeTecnico/categorias); `codigo` from ANVISA's example is untested.
      x-required-filters: {anyOf: []}
      x-verified-filters: [nomeTecnico, categoriaProduto]

  # Verified 2026-09-06 (fixtures gmdn_busca, udi_historicos, err_assunto_busca).
  - target: $.paths['/api/v1/udi/termoGmdn'].post
    update:
      description: >-
        Paginated GMDN term search; names and definitions are in Portuguese. Works with an
        empty `filter`. Verified live: `conteudo` (text); `codigo` from ANVISA's example is
        untested.
      x-required-filters: {anyOf: []}
      x-verified-filters: [conteudo]
  - target: $.paths['/api/v1/udi/historico'].get
    update:
      description: >-
        The daily UDI snapshots (`tipoHistorico` DIARIO, newest first) with `totalRegistros`
        per snapshot; 171 entries on 2026-09-06. Dates are epoch milliseconds.
  - target: $.paths['/api/v1/udi/{idDispositivo}/{idHistorico}'].get
    update:
      description: >-
        One device as recorded in one snapshot. Answers an empty-bodied 404 when the device is
        not part of that snapshot (observed for device 377 in snapshot 171).
  - target: $.paths['/api/v1/assunto/'].post
    update:
      description: >-
        Not usable as observed on 2026-09-06: a JSON `PaginationBuilder` body is answered with
        HTTP 500 'Cannot invoke PaginationBuilder.getColumn() because "filtro" is null', and
        the path without the trailing slash is a 404. Use GET /api/v1/assunto/assuntos and
        filter client-side.
      x-observed-status: broken

  # --- Downloads (probed 2026-09-08) ---------------------------------------------------
  # The spec declares `200: OK` with no content for all six download operations and says
  # nothing about the Accept header. Every one of them answers HTTP 500 "Could not find
  # acceptable representation" to `Accept: application/json` (fixture err_not_acceptable);
  # only GET /udi/{id}/download also accepts it. Send `Accept: */*`.

  # 20. Spreadsheet exports: the body is a file, whatever the operation's filters.
  - &spreadsheet_download
    target: $.paths['/api/v1/fila/downloadfila'].post.responses['200']
    update:
      description: >-
        The spreadsheet itself. `Content-Type: application/vnd.ms-excel` and the file name in
        `Content-Disposition: attachment; filename=...`. Requires `Accept: */*`.
      content:
        application/vnd.ms-excel:
          schema: {type: string, format: binary}
  - {<<: *spreadsheet_download, target: "$.paths['/api/v1/lista/downloadlista'].post.responses['200']"}
  - {<<: *spreadsheet_download, target: "$.paths['/api/v1/nomeTecnico/download'].post.responses['200']"}
  - {<<: *spreadsheet_download, target: "$.paths['/api/v1/assunto/download'].post.responses['200']"}
  - {<<: *spreadsheet_download, target: "$.paths['/api/v1/udi/{id}/download'].get.responses['200']"}
  - {<<: *spreadsheet_download, target: "$.paths['/api/v1/udi/{idDispositivo}/{idHistorico}/download'].get.responses['200']"}

  # 21. POST /fila/downloadfila (fixtures fila_downloadfila, err_export_vazia, err_not_acceptable).
  - target: $.paths['/api/v1/fila/downloadfila'].post
    update:
      description: >-
        Exports one whole subqueue as a spreadsheet (`consulta_fila.xlsx`, 40 rows after a
        7-row header block for subfila 167 on 2026-09-08). The file is OOXML (magic `PK`)
        despite the `application/vnd.ms-excel` content type. `filter.subfila` is required and
        `page`/`size` are ignored, as in /fila/consulta. A subfila with nothing queued is
        HTTP 500 "Nenhum resultado encontrado para exportação." here, not the empty 404 that
        /fila/consulta gives.
      x-required-filters: {allOf: [subfila]}
      x-paginated: false
      x-accept: "*/*"

  # 22. POST /lista/downloadlista (fixture lista_downloadlista): same shape, `subfila` again.
  - target: $.paths['/api/v1/lista/downloadlista'].post
    update:
      description: >-
        Exports one whole sublista as a spreadsheet (`consulta_lista.xlsx`, OOXML, 555 rows
        for sublista 2141 on 2026-09-08). The required filter key is `subfila`, not
        `sublista`, and `page`/`size` are ignored.
      x-required-filters: {allOf: [subfila]}
      x-paginated: false
      x-accept: "*/*"

  # 23. POST /nomeTecnico/download (fixture nomeTecnico_download). The published summary says
  #     "dossiê"; this endpoint exports nomes técnicos.
  - target: $.paths['/api/v1/nomeTecnico/download'].post
    update:
      summary: Faz download do relatório de nomes técnicos
      description: >-
        Exports nomes técnicos as `consulta_nomes_tecnicos_produto_saude.xls` (BIFF .xls, magic
        `D0 CF 11 E0`). No filter is required; the verified filter keys are those of
        POST /nomeTecnico. `size` is ignored: `{"page": 1, "size": 5, "filter":
        {"nomeTecnico": "cateter"}}` returned all 71 matching rows on 2026-09-08.
      x-paginated: false
      x-accept: "*/*"

  # 24. POST /assunto/download (fixtures assunto_download, assunto_download_codigos).
  - target: $.paths['/api/v1/assunto/download'].post
    update:
      description: >-
        Exports assuntos as `consulta_assuntos.xls` (BIFF .xls). An empty `filter` exports all
        2,599 assuntos, about 5 MB. `filter.codigosAssunto` (an array of ids) does bind here,
        unlike POST /api/v1/assunto/ which cannot bind its body at all:
        `{"filter": {"codigosAssunto": [10013]}}` returned a 13 KB file on 2026-09-08.
      x-paginated: false
      x-accept: "*/*"

  # 25. POST /assunto/downloadAssuntoFormulario: the body is a bare JSON integer, not a
  #     PaginationBuilder (fixtures assunto_formulario, err_formulario_body,
  #     err_formulario_inexistente), and the response carries no headers describing the file.
  - target: $.paths['/api/v1/assunto/downloadAssuntoFormulario'].post.requestBody.content['application/json'].schema['$ref']
    remove: true
  - target: $.paths['/api/v1/assunto/downloadAssuntoFormulario'].post.requestBody.content['application/json'].examples
    remove: true
  - target: $.paths['/api/v1/assunto/downloadAssuntoFormulario'].post.requestBody
    update:
      description: >-
        The formulário id as a bare JSON integer. Sending an object fails with HTTP 500
        "com.fasterxml.jackson...: Cannot deserialize value of type `java.lang.Long` from
        Object value"; an unknown id fails with
        "javax.persistence.NoResultException: No entity found for query".
      content:
        application/json:
          schema:
            type: integer
            format: int64
            description: Formulário id, from `DetalheAssunto.formularios[].id`.
            example: 8016
  - target: $.paths['/api/v1/assunto/downloadAssuntoFormulario'].post
    update:
      description: >-
        Returns the form file attached to an assunto. Not a spreadsheet: formulário 8016 of
        assunto 10013 came back as a 66,350-byte .docx on 2026-09-08. The response has neither
        `Content-Type` nor `Content-Disposition`, so the file name has to come from
        `DetalheAssunto.formularios[].nomeArquivo`.
      x-accept: "*/*"
  - target: $.paths['/api/v1/assunto/downloadAssuntoFormulario'].post.responses['200']
    update:
      description: >-
        The raw file bytes, with no `Content-Type` and no `Content-Disposition`. Requires
        `Accept: */*`.
      content:
        '*/*':
          schema: {type: string, format: binary}

  # 26. GET /udi/{id}/download and the historico variant (fixtures udi_download,
  #     err_udi_download_historico).
  - target: $.paths['/api/v1/udi/{id}/download'].get
    update:
      description: >-
        The device detail as `udi.xlsx` (OOXML, one sheet "UDI-DI - Dispositivo": a header row
        plus one row). The only download that also works with `Accept: application/json`.
      x-accept: "*/*"
  - target: $.paths['/api/v1/udi/{idDispositivo}/{idHistorico}/download'].get
    update:
      description: >-
        The device as recorded in one snapshot, as a spreadsheet. When the device is not part
        of that snapshot the export throws instead of 404ing: HTTP 500 with
        `Cannot invoke "...DetalheDispositivoDTO.getDispositivo()" because "item" is null`
        (device 377, snapshot 173, 2026-09-08), where the JSON sibling
        GET /udi/{idDispositivo}/{idHistorico} answers an empty 404. The success case has not
        been observed.
      x-accept: "*/*"

  # 27. GET /udi/historico/{id}/download is a zip, not a spreadsheet (fixture
  #     udi_historico_download): stream it, there is no Content-Length.
  - target: $.paths['/api/v1/udi/historico/{id}/download'].get
    update:
      description: >-
        The snapshot as a zip of the week's daily UDI files, e.g.
        `BR_UDIDI_semanal_atualizacao_20260831_20260906.zip`, 232,435 bytes for snapshot 173
        on 2026-09-08. Sent with `Transfer-Encoding: chunked` and no `Content-Length`, so it
        should be streamed to disk rather than buffered.
      x-accept: "*/*"
  - target: $.paths['/api/v1/udi/historico/{id}/download'].get.responses['200']
    update:
      description: >-
        The zip. `Content-Type: application/zip`, file name in `Content-Disposition`, body
        chunked. Requires `Accept: */*`.
      content:
        application/zip:
          schema: {type: string, format: binary}

  # 28. GET /assunto/servicosAssociados/{codigoServico} (fixture assunto_servicosAssociados):
  #     the spec's schema is right; only the description was missing.
  - target: $.paths['/api/v1/assunto/servicosAssociados/{codigoServico}'].get.responses['200']
    update:
      description: >-
        An array of `ServicoDTO` (`id`, `descricao`, `hiperlink` to the gov.br service page).
        One entry for codigoServico 13497 on 2026-09-08.
