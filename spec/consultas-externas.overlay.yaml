  # 33. POST /certificado/ and /certificadoMedicamento/ need one real filter key: an empty
  #     filter, and `{contexto: ...}` alone, fail with HTTP 500 `mensagens.MSG-013` (fixtures
  #     err_msg013, err_msg013_medicamento). No match is an empty-bodied 404
  #     (certificado_vazio). The trailing slash is part of the route.
  - &certificado_search
    target: $.paths['/api/v1/certificado/'].post
    update:
      description: >-
        Paginated certificados de boas práticas (6,886 rows with nacional + internacional on
        2026-10-22). At least one filter key besides `contexto` is required, otherwise HTTP
        500 `mensagens.MSG-013`; a filter that matches nothing is an empty-bodied 404.
        Verified live: `nacional` + `internacional` (booleans), `status` (ids from
        /certificado/status, comma-separated) and `cnpjCertificada` (3 rows for
        05993698000450); the date and UF keys of the example are untested.
      x-required-filters:
        anyOf: [nacional, internacional, status, cnpjCertificada, certificacaoConcedidaPor, ufs,
                tipoCertificado, dataPublicacaoInicial, dataPublicacaoFinal, dataValidadeInicial,
                dataValidadeFinal, liberacaoSim, liberacaoNao]
        verified: [nacional, internacional, status, cnpjCertificada]
  - <<: *certificado_search
    target: $.paths['/api/v1/certificadoMedicamento/'].post
    update:
      description: >-
        Paginated certificados de boas práticas de medicamentos (2,774 rows with nacional +
        internacional + status 0 on 2026-10-22). At least one filter key besides `contexto` is
        required, otherwise HTTP 500 `mensagens.MSG-013`. Verified live: `nacional` +
        `internacional`, `status` and `cnpjSolicitante` (7 rows for 39809660000153; international
        certificates carry no cnpjCertificada). The lookup-backed keys (classesCertificacao,
        formasFarmaceuticas, linhasCertificacao, certificacaoConcedidaPor) are untested.
      x-required-filters:
        anyOf: [nacional, internacional, status, cnpjCertificada, cnpjSolicitante, codigoUnico,
                pais, certificacaoConcedidaPor, classesCertificacao, formasFarmaceuticas,
                linhasCertificacao, ufs, dataPublicacaoInicial, dataPublicacaoFinal,
                dataValidadeInicial, dataValidadeFinal]
        verified: [nacional, internacional, status, cnpjSolicitante]

