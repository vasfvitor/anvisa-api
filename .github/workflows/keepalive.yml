name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days with no activity, and
# this repository never commits from CI, so its schedules would stop without a sign. Once a month,
# re-enable every workflow here, this one included, except those disabled by hand. The same file
# lives in anvisa-api, anvisa-dash, anvisa-hub and portal-saude. GitHub does not document that
# enabling resets the 60-day clock; if it does not, the email GitHub sends and the age checks in
# the producers' workflows (ANVISA data, CADOP, the portal's lag) are the fallback.

on:
  schedule:
    - cron: "41 7 1 * *" # the 1st of each month
  workflow_dispatch:

permissions:
  actions: write # list and enable workflows

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the workflows not disabled by hand
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.state != "disabled_manually") | "\(.id) \(.path)"' |
            while read -r id path; do
              gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"
              echo "enabled $path"
            done
